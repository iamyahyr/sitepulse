name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sitepulse
          POSTGRES_PASSWORD: sitepulse
          POSTGRES_DB: sitepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitepulse"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://sitepulse:sitepulse@localhost:5432/sitepulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Catches Dockerfile breakage on every PR; images are only pushed by release.yml.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
